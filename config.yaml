baseURL: https://eco.kde.org/
canonifyURLs: true
defaultContentLanguage: en
enableGitInfo: true
enableRobotsTXT: true
i18n:
  content:
    default:
      files:
      - content/_index.md
      - content/get-involved.md
      globs:
      - content/BE4FOSS/*.md
      - content/FEEP/*.md
  genToOtherDir: true
  others:
  - title
  - menu
  - strings
languages:
  ca:
    contentDir: content-trans/ca
    languageCode: ca
    languageName: Català
    menu:
      main:
      - name: FEEP
        url: /#feep
        weight: 2
      - name: BE4FOSS
        url: /#be4foss
        weight: 3
      - name: Donatius
        url: https://kde.org/community/donations/
        weight: 6
    title: KDE Eco
    weight: 2
