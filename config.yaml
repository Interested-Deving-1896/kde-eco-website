baseURL: https://eco.kde.org/
canonifyURLs: true
defaultContentLanguage: en
enableGitInfo: true
enableRobotsTXT: true
i18n:
  content:
    default:
      files:
      - content/_index.md
      - content/BE4FOSS/*.md
      - content/FEEP/*.md
  genToOtherDir: true
  others:
  - title
  - menu
  - strings
languages:
  en:
    languageCode: en
    languageName: English
    menu:
      main:
        - name: Donate
          url: https://kde.org/community/donations/
          weight: 6
    title: KDE Eco
    weight: 1
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: tango
module:
  imports:
  - path: invent.kde.org/websites/aether-sass
outputs:
  home:
  - HTML
  - RSS
  section:
  - HTML
params:
  images:
  - /logo-150x150.png
  logo: /logo-150x150.png
  madeByKDE: true
  repoName: eco-kde-org
  showPatrons: false
rssLimit: 4
summaryLength: 30
