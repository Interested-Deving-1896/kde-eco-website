home.header.be4foss.description:
  other: Nachhaltigkeitslabels für Produkte sind bereits weit verbreitet. Aber wie
    lassen sich diese auf Software übertragen? Welche Kriterien sind relevant? Wir
    brauchen mehr Pionier*innen, um herauszufinden, wie wir Software nachhaltig gestalten
    können.
