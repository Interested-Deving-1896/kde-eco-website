home.help:
  other: How you can help
home.help.description:
  other: "
  - Follow 3-steps to Blauer Engel eco-certification: (1) Measure, (2) Analyze, (3) Certify

  - Squash bugs labelled 'efficiency'

  - Set up a measurement lab in your community

  - Develop automation tools for energy consumption measurements

  - Assist with statistical analyses and related tools (e.g., OSCAR)"
home.help.alt:
  other: Image of computer directory with globe
home.feep:
  other: FOSS Energy Efficiency Project (FEEP)
home.feep.description:
  other: "FEEP is developing tools to improve energy efficiency in free and open source software development. Design and implementation of software has a significant impact on the energy consumption of the systems it is part of. With the right tools, it is possible to quantify and drive down energy consumption. This increased efficiency contributes to a more sustainable use of energy as one of the shared resources of our planet.

  - GitLab repository: https://invent.kde.org/cschumac/feep"
home.feep.alt:
  other: Image of globe with computer mouse
home.be4foss:
  other: Blauer Engel For FOSS (BE4FOSS)
home.be4foss.description:
  other: "In 2020 the Umweltbundesamt ('German Environment Agency') released the award criteria for obtaining eco-certification with the Blauer Engel label for desktop software. Categories for certification include energy efficiency, extending the potential operating life of hardware, and user autonomy … all of which fit seamlessly with free and open source software.


  The BE4FOSS project advances eco-certification for resource efficient software in the FOSS community. Obtaining the Blauer Engel label occurs in 3 steps: (1) Measure, (2) Analyze, and (3) Certify.


  1. **Measure** in dedicated labs, such as at KDAB Berlin

  2. **Analyze** using statistical tools such as OSCAR (Open source Software Consumption Analysis in R)

  3. **Certify** by submitting the report on the fulfillment of the Blauer Engel criteria


The benefits of obtaining the ecolabel include:

  - Recognition of reaching high standards for environmentally-friendly software design

  - Differentiating free software from the alternatives

  - Increasing the appeal of adoption for consumers

  - Promoting transparency in the ecological footprint of software"
home.be4foss.alt:
  other: Image of Blauer Engel ecolabel
