home.description:
  other: "
KDE Eco supports the FEEP and BE4FOSS programs to help free & open source communities produce more environmentally friendly software. The projects provide communities with guidelines and support to optimize software to be more energy efficient and have a longer life-span.

Let’s make energy efficient software and digital sustainability part of our story so we can live up to our responsibility for this and future generations!"
