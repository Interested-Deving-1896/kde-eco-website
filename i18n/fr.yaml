home.header.be4foss.description:
  other: Les labels Éco pour les produits sont déjà largement utilisés. Mais comment
    les adapter aux logiciels ? Quels sont les critères pertinents ? Nous avons besoin
    de plus de pionniers pour découvrir comment nous pouvons rendre les logiciels
    durables.
