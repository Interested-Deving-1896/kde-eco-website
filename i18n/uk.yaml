home.header.be4foss.description:
  other: Екомітки для продуктів вже широко використовуються. Але як їх можна використати
    для програмного забезпечення? Які критерії його стосуються? Нам потрібно більше
    дослідників, які визначатимуть, як нам зробити програмне забезпечення екологічнішим.
home.header.be4foss.subtitle:
  other: Blauer Engel для вільного програмного забезпечення з відкритим кодом
home.header.feep.description:
  other: Якщо виміряти енергоспоживання програмного забезпечення? На що вона впливає?
    Ми працюємо над тим, щоб зробити світ вільного програмного забезпечення стабільнішим.
home.header.feep.subtitle:
  other: Проєкт енергоефективності для вільного програмного забезпечення із відкритим
    кодом
