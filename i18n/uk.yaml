  other: 'Виконайте трикрокову екосертифікацію Blauer Engel: (1) вимірювання, (2)
    аналіз, (3) сертифікація'
home.help.three:
  other: Створіть вимірювальну лабораторію у вашій спільноті
home.help.two:
