{{ define "main" }}
<main role="main">
	<section class="section-blue mt-0">
		<div class="container p-5">
			<h1 class="my-2">{{ .Title | humanize }}&nbsp;{{ partial "rss_section.html" . }}</h1>
			{{ $title := .Title }}

			<p>{{ .Params.subtitle }}</p>
	</section>

	<section class="container pt-4">
		{{ with .Content }}
		{{.}}
		{{ end }}
	</section>

</main>
{{ end }}
